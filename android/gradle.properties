# Increase Gradle memory
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process

# Disable incremental Kotlin compilation to avoid daemon issues
kotlin.incremental=false

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true
